services:
 postgres:
  image: postgres:17-bookworm
  environment:
   POSTGRES_DB: forkflow
   POSTGRES_USER: forkflow_migration
   POSTGRES_PASSWORD: ${CLOUD_DEV_DATABASE_PASSWORD:?Set CLOUD_DEV_DATABASE_PASSWORD}
  ports: ["127.0.0.1:54329:5432"]
  volumes: ["postgres:/var/lib/postgresql/data"]
 minio:
  image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  command: server /data --console-address :9001
  environment:
   MINIO_ROOT_USER: ${CLOUD_DEV_STORAGE_USER:?Set CLOUD_DEV_STORAGE_USER}
   MINIO_ROOT_PASSWORD: ${CLOUD_DEV_STORAGE_PASSWORD:?Set CLOUD_DEV_STORAGE_PASSWORD}
  ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  volumes: ["objects:/data"]
volumes:
 postgres:
 objects:
