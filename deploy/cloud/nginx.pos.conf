server {
 listen 80;
 server_name _;
 # Caddy terminates HTTPS; keep redirects relative to the browser's HTTPS URL.
 absolute_redirect off;
 # The existing owner session protects the Internet-facing staff-PIN application.
 location = /_pos_access {
  internal;
  proxy_pass http://api:4200/v1/auth/pos-access;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
 }
 location = /owner { return 302 /owner/; }
 location /owner/ { proxy_pass http://ui:80/; proxy_set_header Host $host; }
 location /v1/ { proxy_pass http://api:4200; proxy_set_header Host $host; }
 location = /health { proxy_pass http://api:4200/health; }
 # Outlet identity is public so the browser can check it before authenticating.
 location = /api/health { proxy_pass http://pos:4100/api/health; }
 # Preserve existing invitation/reset links sent before the POS deployment.
 location = /reset { proxy_pass http://ui:80/reset; }
 location = /invite { proxy_pass http://ui:80/invite; }
 location @pos_unauthorized {
  default_type application/json;
  return 401 '{"error":"Owner sign-in required"}';
 }
 location /api/ {
  auth_request /_pos_access;
  error_page 401 = @pos_unauthorized;
  proxy_pass http://pos:4100;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 3600;
 }
 location @owner_login { return 302 /owner/?pos=1; }
 location / {
  auth_request /_pos_access;
  error_page 401 = @owner_login;
  proxy_pass http://pos:4100;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 3600;
 }
}
