appId: in.masalapos.pos
productName: MasalaPOS
directories:
  app: build/desktop/commercial
  output: dist/commercial
beforePack: ./tools/verify-desktop-package.mjs
electronVersion: 43.4.0
npmRebuild: false
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
files:
  - "**/*"
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/desktop/icon.ico
  artifactName: "MasalaPOS-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  include: tools/installer.nsh
# Auto-update feed. Stable releases are uploaded as drafts and go live when published on GitHub;
# patch (hotfix) builds are uploaded as pre-releases, which only installations on the Patch channel take.
publish:
  provider: github
  owner: vaibhavforeal
  repo: Restaurant-Billing-System
  releaseType: draft
